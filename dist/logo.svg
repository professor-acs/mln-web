<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c96d"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a07a30"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14143a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <g transform="translate(256, 252) scale(1.6)" filter="url(#shadow)">
    <!-- Base Star -->
    <path d="M0 -90 L26 -28 L94 -28 L39 12 L60 78 L0 38 L-60 78 L-39 12 L-94 -28 L-26 -28 Z" fill="url(#gold)"/>
    <!-- Facets for 3D effect -->
    <path d="M0 -90 L26 -28 L0 10 Z" fill="#ffffff" fill-opacity="0.3"/>
    <path d="M94 -28 L39 12 L0 10 Z" fill="#000000" fill-opacity="0.05"/>
    <path d="M39 12 L60 78 L0 38 Z" fill="#000000" fill-opacity="0.25"/>
    <path d="M0 38 L-60 78 L-39 12 Z" fill="#000000" fill-opacity="0.4"/>
    <path d="M-39 12 L-94 -28 L0 10 Z" fill="#000000" fill-opacity="0.25"/>
    <path d="M0 -90 L-26 -28 L0 10 Z" fill="#ffffff" fill-opacity="0.1"/>
  </g>
</svg>
